[project]
name = "profile"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]==0.104.1",
    "uvicorn==0.24.0",
    "aio-pika==9.2.0",
    "pydantic[email]==2.9.2",
    "dotenv>=0.9.9",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.1",
    "psycopg2-binary>=2.9.11",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.12.0",
    "psycopg>=3.2.12",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "pytest-mock",
]
