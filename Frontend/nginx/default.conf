limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$upstream_addr"';

upstream gateway_backend {
    least_conn;
    server social-network-w-gateway-1:8000 max_fails=2 fail_timeout=5s;
    server social-network-w-gateway-2:8000 max_fails=2 fail_timeout=5s;
    server social-network-w-gateway-3:8000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name localhost;

        location /auth/ {
            proxy_pass http://gateway_backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /post/ {
            proxy_pass http://gateway_backend/post/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /profile/ {
            proxy_pass http://gateway_backend/profile/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /search/ {
            proxy_pass http://gateway_backend/search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://gateway_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        client_max_body_size 10M;
        access_log /var/log/nginx/access.log upstream_log;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_disable "msie6";
}