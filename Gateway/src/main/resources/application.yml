server:
  port: 8000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8001
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: post-service
          uri: http://localhost:8002
          predicates:
            - Path=/post/**
          filters:
            - StripPrefix=1
        - id: profile-service
          uri: http://localhost:8003
          predicates:
            - Path=/profile/**
          filters:
            - StripPrefix=1
        - id: search-service
          uri: http://localhost:8004
          predicates:
            - Path=/search/**
          filters:
            - StripPrefix=1

logging:
  level:
    com.socialw.gateway: INFO