server:
  port: 8000

spring:
  application:
    name: gateway-docker
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers:
              - "*"
            exposed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-service
          uri: ${GATEWAY_AUTH_URL:http://auth-service:8001}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: post-service
          uri: ${GATEWAY_POST_URL:http://post-service:8002}
          predicates:
            - Path=/post/**
          filters:
            - StripPrefix=1

        - id: profile-service
          uri: ${GATEWAY_PROFILE_URL:http://profile-service:8003}
          predicates:
            - Path=/profile/**
          filters:
            - StripPrefix=1

        - id: search-service
          uri: ${GATEWAY_SEARCH_URL:http://search-service:8004}
          predicates:
            - Path=/search/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.socialw.gateway: INFO
    org.springframework.cloud.gateway: DEBUG
    com.socialw.gateway.filter.JwtAuthenticationFilter: DEBUG