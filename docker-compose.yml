version: '3.8'

services:
  # Базы данных PostgreSQL
  auth-db:
    image: postgres:17
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - social-network

  post-db:
    image: postgres:17
    container_name: post-postgres
    environment:
      POSTGRES_DB: post_db
      POSTGRES_USER: post_user
      POSTGRES_PASSWORD: post_password
    ports:
      - "5433:5432"
    volumes:
      - post_db_data:/var/lib/postgresql/data
    networks:
      - social-network

  profile-db:
    image: postgres:17
    container_name: profile-postgres
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_password
    ports:
      - "5434:5432"
    volumes:
      - profile_db_data:/var/lib/postgresql/data
    networks:
      - social-network

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - social-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - social-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - social-network

  # Сервисы приложения
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8000
    depends_on:
      - auth-service
      - post-service
      - profile-service
      - search-service
    networks:
      - social-network

  auth-service:
    build:
      context: "./Auth Service"
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8001
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - auth-db
      - redis
    networks:
      - social-network

  post-service:
    build:
      context: "./Post Service"
      dockerfile: Dockerfile
    container_name: post-service
    ports:
      - "8002:8002"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8002
      - SPRING_DATASOURCE_URL=jdbc:postgresql://post-db:5432/post_db
      - SPRING_DATASOURCE_USERNAME=post_user
      - SPRING_DATASOURCE_PASSWORD=post_password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      - post-db
      - rabbitmq
    networks:
      - social-network

  profile-service:
    build:
      context: "./Profile Service"
      dockerfile: Dockerfile
    container_name: profile-service
    ports:
      - "8003:8003"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8003
      - SPRING_DATASOURCE_URL=jdbc:postgresql://profile-db:5432/profile_db
      - SPRING_DATASOURCE_USERNAME=profile_user
      - SPRING_DATASOURCE_PASSWORD=profile_password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      - profile-db
      - rabbitmq
    networks:
      - social-network

  search-service:
    build:
      context: "./Search Service"
      dockerfile: Dockerfile
    container_name: search-service
    ports:
      - "8004:8004"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8004
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      - elasticsearch
      - rabbitmq
    networks:
      - social-network

volumes:
  auth_db_data:
  post_db_data:
  profile_db_data:
  elasticsearch_data:
  redis_data:
  rabbitmq_data:

networks:
  social-network:
    driver: bridge