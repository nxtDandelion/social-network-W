name: Integration Tests

on:
  push:
    branches:
      - dev
      - test
  pull_request:
    branches:
      - dev
      - test
  schedule:
    - cron: '0 2 * * *'   # ежедневно в 2:00 UTC (опционально)

jobs:
  gateway-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-gateway-${{ hashFiles('Gateway/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-gateway-

      - name: Run Gateway integration tests
        working-directory: Gateway
        run: mvn clean test

  search-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-search-${{ hashFiles('Search Service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-search-

      - name: Build post-service image
        run: docker build -t socialw/post-service:latest ./Post\ Service

      - name: Run Search integration tests
        working-directory: Search Service
        run: mvn clean test

  python-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Сборка образов
      - name: Build Images
        run: |
          docker build -t socialw/auth-service:latest "./Auth Service"
          docker build -t socialw/post-service:latest "./Post Service"
          docker build -t socialw/profile-service:latest "./Profile Service"

      # 2. Запуск инфраструктуры (БЕЗ конфликтов имен)
      - name: Run Infrastructure
        run: |
          # Используем сеть host, чтобы порты пробрасывались напрямую на localhost раннера
          # Флаг -p 5432:5432 в режиме --network host не нужен, но мы задаем порты внутри PG
          docker run --detach --network host --name auth-postgres -e POSTGRES_PASSWORD=auth_password postgres:17 -p 5432
          docker run --detach --network host --name post-postgres -e POSTGRES_PASSWORD=post_password postgres:17 -p 5433
          docker run --detach --network host --name profile-postgres -e POSTGRES_PASSWORD=profile_password postgres:17 -p 5434
          
          docker run --detach --network host --name rabbitmq-container rabbitmq:3-management
          docker run --detach --network host --name redis-container redis:7-alpine
          
          echo "Waiting for databases to initialize..."
          sleep 15

      - name: Fix DNS for hardcoded hostnames
        run: |
          # Принудительно направляем имя 'rabbitmq' на localhost
          echo "127.0.0.1 rabbitmq" | sudo tee -a /etc/hosts
          # На всякий случай добавим и базы, если они где-то захардкожены
          echo "127.0.0.1 auth-db post-db profile-db" | sudo tee -a /etc/hosts
      # 3. Запуск сервисов с проверкой путей
      - name: Run Services
        run: |
          # Теперь ждем именно хост 'rabbitmq'
          WAIT_RABBIT="import socket, time; s = socket.socket(); 
          while s.connect_ex(('rabbitmq', 5672)) != 0: time.sleep(1)"
          
          echo "Starting Auth Service..."
          docker run --detach --network host --name auth-app \
            -e DATABASE_URL=postgresql+asyncpg://postgres:auth_password@127.0.0.1:5432/postgres \
            socialw/auth-service:latest uvicorn app.main:app --host 0.0.0.0 --port 8001
          
          echo "Starting Post Service..."
          docker run --detach --network host --name post-app \
            -e DATABASE_URL=postgresql+asyncpg://postgres:post_password@127.0.0.1:5433/postgres \
            -e RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/ \
            --entrypoint sh socialw/post-service:latest \
            -c "python3 -c \"$WAIT_RABBIT\" && uvicorn app.main:app --host 0.0.0.0 --port 8002"
          
          echo "Starting Profile Service..."
          docker run --detach --network host --name profile-app \
            -e DATABASE_URL=postgresql+asyncpg://postgres:profile_password@127.0.0.1:5434/postgres \
            -e RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/ \
            --entrypoint sh socialw/profile-service:latest \
            -c "python3 -c \"$WAIT_RABBIT\" && uvicorn app.main:app --host 0.0.0.0 --port 8003"
          
          echo "Warm up services..."
          sleep 20
          
          # 4. Тесты
      - name: Setup Python
        uses: astral-sh/setup-uv@v3

      - name: Run Integration Tests
        env:
          AUTH_SERVICE_URL: http://127.0.0.1:8001
          POST_SERVICE_URL: http://127.0.0.1:8002
          PROFILE_SERVICE_URL: http://127.0.0.1:8003
          # Тут тоже меняем на 127.0.0.1
          AUTH_DB_URL: postgresql+asyncpg://postgres:auth_password@127.0.0.1:5432/postgres
          POST_DB_URL: postgresql+asyncpg://postgres:post_password@127.0.0.1:5433/postgres
          PROFILE_DB_URL: postgresql+asyncpg://postgres:profile_password@127.0.0.1:5434/postgres
          PYTHONPATH: .
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install pytest pytest-asyncio httpx sqlalchemy asyncpg
          pytest python_integrations/ -v

      # 5. Логи
      - name: Debug Logs
        if: always()
        run: |
          docker ps
          docker logs auth-app || true
          docker logs post-app || true
          docker logs profile-app || true
          docker logs rabbitmq-container || true