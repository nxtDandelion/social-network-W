name: Integration Tests

on:
  push:
    branches:
      - dev
      - test
  pull_request:
    branches:
      - dev
      - test
  schedule:
    - cron: '0 2 * * *'   # ежедневно в 2:00 UTC (опционально)

jobs:
  gateway-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-gateway-${{ hashFiles('Gateway/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-gateway-

      - name: Run Gateway integration tests
        working-directory: Gateway
        run: mvn clean test

  search-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-search-${{ hashFiles('Search Service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-search-

      - name: Build post-service image
        run: docker build -t socialw/post-service:latest ./Post\ Service

      - name: Run Search integration tests
        working-directory: Search Service
        run: mvn clean test

  python-integrations:
    runs-on: ubuntu-latest
    services:
      auth-db:
        image: postgres:15
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_password
          POSTGRES_DB: auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      profile-db:
        image: postgres:15
        env:
          POSTGRES_USER: profile_user
          POSTGRES_PASSWORD: profile_password
          POSTGRES_DB: profile_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      post-db:
        image: postgres:15
        env:
          POSTGRES_USER: post_user
          POSTGRES_PASSWORD: post_password
          POSTGRES_DB: post_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create and Sync Environment
        run: |
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
        
          uv pip install -r "Auth Service/requirements.txt" || echo "No requirements.txt in Auth"
          
          cd "Profile Service" && uv pip install . && cd ..
          
          uv pip install -r "Post Service/requirements.txt" || echo "No requirements.txt in Post"
          
          uv pip install pytest pytest-asyncio httpx sqlalchemy asyncpg

      - name: Run Services in Background
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: |
          # Запускаем каждый сервис в фоновом режиме
          DATABASE_URL=postgresql+asyncpg://auth_user:auth_password@localhost:5432/auth_db python "Auth Service/main.py" &
          DATABASE_URL=postgresql+asyncpg://profile_user:profile_password@localhost:5434/profile_db python "Profile Service/main.py" &
          DATABASE_URL=postgresql+asyncpg://post_user:post_password@localhost:5433/post_db python "Post Service/main.py" &
          
          # Даем сервисам время на запуск
          sleep 20

      - name: Run Integration Tests
        env:
          AUTH_SERVICE_URL: http://localhost:8001
          PROFILE_SERVICE_URL: http://localhost:8003
          POST_SERVICE_URL: http://localhost:8002
          AUTH_DB_URL: postgresql+asyncpg://auth_user:auth_password@localhost:5432/auth_db
          PROFILE_DB_URL: postgresql+asyncpg://profile_user:profile_password@localhost:5434/profile_db
          POST_DB_URL: postgresql+asyncpg://post_user:post_password@localhost:5433/post_db
        run: |
          # Запуск самих файлов тестов
          pytest python_integrations -v