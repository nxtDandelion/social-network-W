name: Integration Tests

on:
  push:
    branches:
      - dev
      - test
  pull_request:
    branches:
      - dev
      - test
  schedule:
    - cron: '0 2 * * *'   # ежедневно в 2:00 UTC (опционально)

jobs:
  gateway-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-gateway-${{ hashFiles('Gateway/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-gateway-

      - name: Run Gateway integration tests
        working-directory: Gateway
        run: mvn clean test

  search-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-search-${{ hashFiles('Search Service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-search-

      - name: Build post-service image
        run: docker build -t socialw/post-service:latest ./Post\ Service

      - name: Run Search integration tests
        working-directory: Search Service
        run: mvn clean test


  report:
    needs: [gateway-integration, search-integration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Publish test results
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests Report
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit